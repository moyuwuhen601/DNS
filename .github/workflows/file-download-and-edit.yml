name: GitHub Actions

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: # 添加这一行，表示允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Git
        run: |
          git config --global user.email "lmj15979853175@gmail.com"
          git config --global user.name "moyuwuhen601"
      - name: Download file
        run: |
          wget -O whitelist_full_combine.txt.tmp https://raw.githubusercontent.com/hezhijie0327/GFWList2AGH/refs/heads/main/gfwlist2adguardhome_new/blacklist_full_combine.txt
          mv whitelist_full_combine.txt.tmp whitelist_full_combine.txt
      - name: Edit file
        run: |
          sed -i 's~https://dns.opendns.com:443/dns-query~https://dns.nextdns.io/b6983a/AdGuardHome~' whitelist_full_combine.txt # 文件名应改为下载的文件名
          sed -i 's~https://doh.pub:443/dns-query~https://dns.nextdns.io/b6983a/AdGuardHome~' whitelist_full_combine.txt
          sed -i 's~tls://dns.alidns.com:853~tls://dns.alidns.com~' whitelist_full_combine.txt
          sed -i 's~tls://dns.google:853~tls://AdGuardHome-b6983a.dns.nextdns.io~' whitelist_full_combine.txt
      - name: Sanitize invalid IDNA domains
        run: |
          python -m pip install --disable-pip-version-check --quiet 'idna>=3,<4'
          python <<'PY'
          from pathlib import Path
          import idna

          path = Path("whitelist_full_combine.txt")
          removed = []
          output = []

          for line_number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(keepends=True), 1):
              line = raw.rstrip("\r\n")
              newline = raw[len(line):]

              if line.startswith("[/") and "/]" in line:
                  domain_part, suffix = line[2:].split("/]", 1)
                  valid_domains = []

                  for domain in domain_part.split("/"):
                      if not domain:
                          continue

                      try:
                          idna.encode(domain, uts46=True, std3_rules=True)
                      except idna.IDNAError as exc:
                          removed.append((line_number, domain, str(exc)))
                          continue

                      valid_domains.append(domain)

                  line = "[/" + "/".join(valid_domains) + "/]" + suffix
                  raw = line + newline

              output.append(raw)

          path.write_text("".join(output), encoding="utf-8")

          if removed:
              print(f"Removed {len(removed)} invalid IDNA domain(s):")
              for line_number, domain, reason in removed:
                  print(f"  line {line_number}: {domain} ({reason})")
          else:
              print("No invalid IDNA domains found.")
          PY
      - name: Upload file
        run: |
          git add whitelist_full_combine.txt # 文件名应改为下载的文件名
          git commit -m "Updated file"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
